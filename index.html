<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="페파피그 영어">
<title>페파피그 영어판 · 시즌별 한 편씩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE3EA; --ink:#3B2026; --soft:#7A5560; --card:#FFFFFF; --line:#F3C3CF;
  --mud:#7A4B38; --mud-ink:#FFF3EC; --accent:#E8517F; --accent-ink:#FFFFFF;
  --t1:#FF9DB8; --t2:#8FD0F2; --t3:#8EDB86; --t4:#FFD36B; --t5:#C3A8F5;
  --t6:#FFB27C; --t7:#7EE0C8; --t8:#FF8E8E; --t9:#8AAEF7;
  --tile-ink:#3B2026;
  --font:'Jua','Apple SD Gothic Neo','Noto Sans KR',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#2A1920; --ink:#FFE8EE; --soft:#C9A3AF; --card:#3A252D; --line:#5A3A45;
    --mud:#5C3A2C; --mud-ink:#FFE9DD; --accent:#FF7DA3; --accent-ink:#2A1920;
    color-scheme:dark;
  }
  meta[name=theme-color]{content:#2A1920}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4}
body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
[hidden]{display:none!important}

/* ––––– home ––––– */
.puddle{
position:relative;margin:8px 0 22px;padding:30px 22px 34px;
background:var(–mud);color:var(–mud-ink);
border-radius:58% 42% 55% 45% / 62% 56% 44% 38%;
text-align:center;
}
.puddle::after{ /* ripple */
content:””;position:absolute;inset:10px 14px;border-radius:inherit;
border:2px solid color-mix(in srgb,var(–mud-ink) 30%,transparent);pointer-events:none;
}
.puddle h1{margin:0;font-size:34px;font-weight:400;letter-spacing:-.01em}
.puddle p{margin:6px 0 0;font-size:16px;opacity:.9}
.gear{position:absolute;right:6px;top:-6px;width:44px;height:44px;border-radius:50%;
background:var(–card);box-shadow:0 2px 0 var(–line);font-size:20px;z-index:2}

.seasons{display:grid;grid-template-columns:1fr 1fr;gap:14px;list-style:none;margin:0;padding:0}
.tile{
width:100%;aspect-ratio:1/0.92;border-radius:28px;padding:14px 16px;text-align:left;
display:flex;flex-direction:column;justify-content:space-between;
color:var(–tile-ink);box-shadow:0 5px 0 rgba(0,0,0,.14);
transition:transform .12s ease, box-shadow .12s ease;
}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.tile .lab{font-size:17px}
.tile .num{font-size:68px;line-height:.9}
.tile .sub{font-size:15px;opacity:.8}
.tile.empty{background:transparent!important;border:3px dashed var(–line);box-shadow:none;color:var(–soft)}
.tile.empty:active{transform:none}
.tile.done .sub::before{content:“✓ “}

/* ––––– player ––––– */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{height:48px;padding:0 18px;border-radius:24px;background:var(–card);box-shadow:0 3px 0 var(–line);font-size:17px}
.season-name{font-size:22px}
.stage{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.stage #yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
background:rgba(40,20,28,.88);color:#FFF3F6;text-align:center;padding:16px;z-index:3}
.veil h2{margin:0;font-size:28px;font-weight:400}
.veil .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.veil a{color:#FFD36B}
.now{margin:16px 4px 4px;font-size:26px;line-height:1.25}
.count{margin:0 4px 14px;color:var(–soft);font-size:16px}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{min-height:56px;border-radius:20px;background:var(–card);box-shadow:0 4px 0 var(–line);font-size:18px;padding:6px 8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(–line)}
.btn.main{background:var(–accent);color:var(–accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(–accent) 65%,#000)}
.btn:disabled{opacity:.4}
.switch{display:flex;align-items:center;gap:10px;margin:16px 4px 4px;color:var(–soft);font-size:16px}
.switch input{width:26px;height:26px;accent-color:var(–accent)}
.picker h3{margin:22px 4px 10px;font-size:19px;font-weight:400}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.ep{width:100%;height:52px;border-radius:16px;background:var(–card);box-shadow:0 3px 0 var(–line);font-size:19px}
.ep.seen{background:color-mix(in srgb,var(–t3) 55%,var(–card))}
.ep[aria-current=true]{background:var(–accent);color:var(–accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(–accent) 65%,#000)}

/* ––––– settings ––––– */
dialog{border:0;border-radius:26px;padding:0;width:min(92vw,520px);max-height:88dvh;background:var(–card);color:var(–ink);font-family:var(–font)}
dialog::backdrop{background:rgba(30,12,20,.55)}
.dlg{padding:22px 20px 18px}
.dlg h2{margin:0 0 6px;font-size:24px;font-weight:400}
.dlg p{margin:0 0 14px;color:var(–soft);font-size:15px}
.field{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin-bottom:10px}
.field label{font-size:17px}
.field input{width:100%;height:46px;border-radius:14px;border:2px solid var(–line);background:var(–bg);color:var(–ink);padding:0 12px;font:inherit;font-size:15px}
.field input:focus{outline:3px solid var(–accent);border-color:transparent}
.dlg .row{display:flex;gap:10px;margin-top:16px}
.dlg .row .btn{flex:1}
.link{display:block;margin:14px auto 0;color:var(–soft);text-decoration:underline;font-size:15px;min-height:44px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<main class="wrap">

  <!-- 홈: 시즌 고르기 -->

  <section id="home">
    <header class="puddle">
      <button class="gear" id="openSettings" aria-label="엄마 설정">⚙️</button>
      <h1>페파피그 영어판</h1>
      <p>시즌을 누르면 한 편씩 볼 수 있어요</p>
    </header>
    <ul class="seasons" id="seasons"></ul>
  </section>

  <!-- 플레이어 -->

  <section id="watch" hidden>
    <div class="bar">
      <button class="back" id="back">← 시즌</button>
      <span class="season-name" id="seasonName"></span>
    </div>

  <div id="yt"></div>

```

  </section>
</main>

<!-- 엄마 설정 -->

<dialog id="settings">
  <div class="dlg">
    <h2>엄마 설정</h2>
    <p>시즌마다 YouTube 재생목록 링크를 붙여 넣으면 그 시즌이 열려요. 비워 두면 그 시즌은 숨겨져요.</p>
    <div id="fields"></div>
    <div class="row">
      <button class="btn" id="closeSettings">닫기</button>
      <button class="btn main" id="saveSettings">저장</button>
    </div>
    <button class="link" id="clearSeen">본 기록 지우기</button>
  </div>
</dialog>

<script>
/* ===== 시즌별 재생목록 ===== */
/* 시즌 번호: YouTube 재생목록 ID (링크의 list= 뒤에 오는 값). 여기에 직접 넣어도 되고, 앱의 '엄마 설정'에서 붙여 넣어도 돼요. */
const DEFAULT_LISTS = {
  1: 'PL9H5wl7jyq4RW3I86ECokGqzESs4SrY0Z',
  2: '', 3: '', 4: '', 5: '', 6: '', 7: '', 8: '', 9: ''
};
const SEASONS = [1,2,3,4,5,6,7,8,9];
const TILE_COLORS = ['--t1','--t2','--t3','--t4','--t5','--t6','--t7','--t8','--t9'];

/* ===== 저장소 (막힌 환경에서도 동작하도록 메모리 대체) ===== */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? (k in mem ? mem[k] : d) : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = id => document.getElementById(id);

function listId(n){
  const saved = store.get('pp.lists', {});
  return (String(n) in saved) ? saved[n] : (DEFAULT_LISTS[n] || '');
}
function parseList(s){
  s = (s||'').trim();
  const m = s.match(/[?&]list=([\w-]+)/);
  if (m) return m[1];
  return /^[\w-]{10,}$/.test(s) ? s : '';
}
const seenSet = n => new Set(store.get('pp.seen.'+n, []));
function markSeen(n, id){ const s = seenSet(n); s.add(id); store.set('pp.seen.'+n, [...s]); }

/* ===== 홈 ===== */
function renderHome(){
  const ul = $('seasons'); ul.innerHTML = '';
  SEASONS.forEach((n,i)=>{
    const id = listId(n);
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'tile' + (id ? '' : ' empty');
    if (id) b.style.background = `var(${TILE_COLORS[i % TILE_COLORS.length]})`;
    const seen = seenSet(n).size;
    b.innerHTML = `<span class="lab">시즌</span><span class="num">${n}</span><span class="sub">${id ? (seen ? seen+'편 봤어요' : '보러 가기') : '링크 연결 필요'}</span>`;
    if (seen) b.classList.add('done');
    b.setAttribute('aria-label', `시즌 ${n}` + (id ? '' : ' (링크 연결 필요)'));
    b.onclick = () => id ? openSeason(n) : openSettings(n);
    li.appendChild(b); ul.appendChild(li);
  });
}

/* ===== 플레이어 ===== */
let player = null, apiReady = false, playerReady = false, pending = null;
let S = { season:0, ids:[], idx:0, token:0, poll:null };

function loadApi(){
  if (window.YT && YT.Player){ apiReady = true; return; }
  if (document.getElementById('yt-api')) return;
  const s = document.createElement('script');
  s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) pending(); };

function ensurePlayer(cb){
  if (player && playerReady) return cb();
  const make = () => {
    if (player){ pending = cb; return; }
    player = new YT.Player('yt', {
      width:'100%', height:'100%',
      playerVars:{ playsinline:1, rel:0, modestbranding:1, iv_load_policy:3, fs:1 },
      events:{
        onReady:()=>{ playerReady = true; cb(); },
        onStateChange:onState,
        onError:onErr
      }
    });
  };
  if (apiReady) make(); else { pending = make; loadApi(); }
}

function show(el, on){ $(el).hidden = !on; }
function resetVeils(){ show('done', false); show('err', false); }

function openSeason(n){
  S.season = n; S.ids = []; S.idx = 0; S.token++;
  const token = S.token;
  clearInterval(S.poll);
  $('home').hidden = true; $('watch').hidden = false;
  $('seasonName').textContent = '시즌 ' + n;
  $('nowTitle').innerHTML = '&nbsp;'; $('count').textContent = ''; $('eps').innerHTML = '';
  resetVeils(); show('loading', true);
  window.scrollTo(0,0);

  ensurePlayer(() => {
    if (token !== S.token) return;
    player.cuePlaylist({ listType:'playlist', list: listId(n) });
    let tries = 0;
    S.poll = setInterval(() => {
      if (token !== S.token){ clearInterval(S.poll); return; }
      let l = null;
      try{ l = player.getPlaylist(); }catch(e){}
      if (l && l.length){
        clearInterval(S.poll);
        S.ids = l;
        const last = store.get('pp.last.'+n, 0);
        S.idx = (last >= 0 && last < l.length) ? last : 0;
        buildEps();
        go(S.idx, false);
        show('loading', false);
      } else if (++tries > 40){
        clearInterval(S.poll);
        show('loading', false);
        showErr('재생목록을 못 불러왔어요', '링크가 맞는지, 재생목록이 공개인지 엄마 설정에서 확인해 주세요.', null);
      }
    }, 400);
  });
}

function buildEps(){
  const ul = $('eps'); ul.innerHTML = '';
  const seen = seenSet(S.season);
  S.ids.forEach((id,i)=>{
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'ep' + (seen.has(id) ? ' seen' : '');
    b.textContent = i+1;
    b.setAttribute('aria-label', (i+1)+'편');
    b.onclick = () => { go(i, true); window.scrollTo({top:0,behavior:'smooth'}); };
    li.appendChild(b); ul.appendChild(li);
  });
}

function go(i, play){
  if (i < 0 || i >= S.ids.length) return;
  S.idx = i; store.set('pp.last.'+S.season, i);
  resetVeils();
  const id = S.ids[i];
  if (play) player.loadVideoById(id); else player.cueVideoById(id);
  updateUi();
}

function cleanTitle(t){
  return (t||'')
    .replace(/peppa pig/ig,'')
    .replace(/\((series|season)\s*\d+\)/ig,'')
    .replace(/\(\s*with subtitles\s*\)/ig,'')
    .replace(/\|.*$/,'')
    .replace(/^[\s\-–:]+|[\s\-–:]+$/g,'')
    .trim() || '페파피그';
}
function updateTitle(){
  try{
    const d = player.getVideoData();
    if (d && d.title) $('nowTitle').textContent = cleanTitle(d.title);
  }catch(e){}
}
function updateUi(){
  const n = S.ids.length;
  $('count').textContent = `${S.idx+1} / ${n}편`;
  $('prev').disabled = S.idx === 0;
  $('next').disabled = S.idx >= n-1;
  document.querySelectorAll('.ep').forEach((b,i)=>{
    if (i === S.idx) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');
  });
  const cur = document.querySelectorAll('.ep')[S.idx];
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
  updateTitle();
}

function onState(e){
  const st = e.data; // -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued
  if (st === 1 || st === 5 || st === 3){ resetVeils(); updateTitle(); }
  if (st === 0){
    const id = S.ids[S.idx];
    markSeen(S.season, id);
    const b = document.querySelectorAll('.ep')[S.idx]; if (b) b.classList.add('seen');
    const hasNext = S.idx < S.ids.length-1;
    if ($('autoNext').checked && hasNext){ go(S.idx+1, true); return; }
    show('doneNext', hasNext);
    show('done', true);
  }
}
function showErr(title, msg, id){
  $('errTitle').textContent = title; $('errMsg').textContent = msg;
  const a = $('errLink');
  if (id){ a.href = 'https://www.youtube.com/watch?v=' + id; a.hidden = false; } else { a.hidden = true; }
  show('errNext', !!id && S.idx < S.ids.length-1);
  show('err', true);
}
function onErr(e){
  const id = S.ids[S.idx];
  if (!id) return;
  showErr('이 영상은 여기서 재생이 안 돼요', '퍼가기가 막힌 영상일 수 있어요. 다음 편으로 넘어가거나 YouTube에서 열어 주세요.', id);
}

/* ===== 버튼 ===== */
$('back').onclick = () => {
  S.token++; clearInterval(S.poll);
  try{ player.stopVideo(); }catch(e){}
  $('watch').hidden = true; $('home').hidden = false;
  renderHome(); window.scrollTo(0,0);
};
$('prev').onclick = () => go(S.idx-1, true);
$('next').onclick = () => go(S.idx+1, true);
$('again').onclick = () => go(S.idx, true);
$('doneAgain').onclick = () => go(S.idx, true);
$('doneNext').onclick = () => go(S.idx+1, true);
$('errNext').onclick = () => go(S.idx+1, true);
$('autoNext').checked = !!store.get('pp.auto', false);
$('autoNext').onchange = e => store.set('pp.auto', e.target.checked);

/* ===== 설정 ===== */
const dlg = $('settings');
function buildFields(){
  const box = $('fields'); box.innerHTML = '';
  SEASONS.forEach(n=>{
    const row = document.createElement('div'); row.className = 'field';
    const id = listId(n);
    row.innerHTML = `<label for="f${n}">시즌 ${n}</label>
      <input id="f${n}" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="재생목록 링크 붙여넣기" value="${id ? 'https://www.youtube.com/playlist?list='+id : ''}">`;
    box.appendChild(row);
  });
}
function openSettings(focusSeason){
  buildFields();
  dlg.showModal();
  if (focusSeason){ const f = $('f'+focusSeason); if (f) f.focus(); }
}
$('openSettings').onclick = () => openSettings();
$('closeSettings').onclick = () => dlg.close();
$('saveSettings').onclick = () => {
  const out = {};
  SEASONS.forEach(n => { out[n] = parseList($('f'+n).value); });
  store.set('pp.lists', out);
  dlg.close(); renderHome();
};
$('clearSeen').onclick = () => {
  SEASONS.forEach(n => { store.del('pp.seen.'+n); store.del('pp.last.'+n); });
  renderHome();
};

renderHome();
loadApi();
</script>

</body>
